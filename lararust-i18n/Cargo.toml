[package]
name = "lararust-i18n"
version = "0.1.0"
edition = "2024"

# Important: Include /lang/ when publishing
include = [
    "src/**",
    "lang/**",
    "Cargo.toml",
    "README.md",
    "LICENSE"
]

[[bench]]
name = "i18n_benches"
harness = false

[dev-dependencies]
criterion = "0.5"

[build-dependencies]
chrono = "0.4"

[dependencies]
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.7"